name: CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:

  
  # JOB 1: LINT
  lint:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Black (format check)
        run: black --check .

      - name: Run Ruff (lint)
        run: ruff check .


  # JOB 2: TEST
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests with coverage
        env:
          SECRET_KEY: test-secret-key
          EMPLOYEE_API_KEY: test-employee-key
          MANAGER_API_KEY: test-manager-key
          ADMIN_API_KEY: test-admin-key
          OPENAI_API_KEY: sk-test-key
        run: |
          pytest app/tests/ \
            -v \
            --tb=short \
            --strict-markers \
            --disable-warnings \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=40

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false


  # JOB 3: SECURITY + TYPE CHECKS
  security:
    name: Security & Type Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # TYPE CHECKING
      - name: Run MyPy (type checking)
        run: mypy .

      # SECURITY SCAN (code)
      - name: Run Bandit (security scan)
        run: bandit -r app/

      # SECURITY SCAN (dependencies)
      - name: Run pip-audit (vulnerabilities)
        run: pip-audit


  # JOB 4: DOCKER
  docker:
    name: Docker Build & Runtime Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: policyguard-ai:test
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Update cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Test container startup
        run: |
          docker run --rm policyguard-ai:test python -c "
          import app;
          print('App import OK');
          print('Container runtime OK')
          "

      - name: Check image size
        run: |
          docker images policyguard-ai:test --format "{{.Size}}"

      - name: Cleanup Docker
        run: docker system prune -f