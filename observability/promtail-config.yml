server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Scrape Docker container logs
  - job_name: docker
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker
          __path__: /var/lib/docker/containers/*/*.log
    
    pipeline_stages:
      # Parse JSON logs
      - json:
          expressions:
            log: log
            stream: stream
            time: time
      
      # Extract log level
      - regex:
          expression: '(?P<level>INFO|DEBUG|WARNING|ERROR|CRITICAL)'
          source: log
      
      # Set labels
      - labels:
          level:
          stream: