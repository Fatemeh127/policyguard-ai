
networks:
  policyguard-network:
    driver: bridge

volumes:
  vector_db:
  redis_data:
  prometheus_data:
  loki_data:
  grafana_data:

services:
  # ==================== CORE SERVICES ====================
  
  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: policyguard-qdrant
    networks:
      - policyguard-network
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - vector_db:/qdrant/storage

  # Redis (Metrics Storage)
  redis:
    image: redis:7-alpine
    container_name: policyguard-redis
    networks:
      - policyguard-network
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  # ==================== OBSERVABILITY STACK ====================
  
  # Loki (Log Aggregation)
  loki:
    image: grafana/loki:latest
    container_name: policyguard-loki
    networks:
      - policyguard-network
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki-config.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml

  # Promtail (Log Shipper)
  promtail:
    image: grafana/promtail:latest
    container_name: policyguard-promtail
    networks:
      - policyguard-network
    volumes:
      - ./observability/promtail-config.yml:/etc/promtail/config.yml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

  # Prometheus (Metrics Collection)
  prometheus:
    image: prom/prometheus:latest
    container_name: policyguard-prometheus
    networks:
      - policyguard-network
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  # Grafana (Visualization)
  grafana:
    image: grafana/grafana:latest
    container_name: policyguard-grafana
    networks:
      - policyguard-network
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}  
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_LOG_LEVEL=info
    depends_on:
      - prometheus
      - loki

  # ==================== APPLICATION SERVICES ====================
  
  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: policyguard-backend
    networks:
      - policyguard-network
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./data:/app/data
      - ./.env:/app/.env
    env_file:
      - .env
    environment:
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379
    depends_on:
      - qdrant
      - redis
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000 --reload

  # Streamlit Frontend
  frontend:
    image: python:3.11-slim
    container_name: policyguard-frontend
    networks:
      - policyguard-network
    working_dir: /app
    ports:
      - "8501:8501"
    volumes:
      - ./ui:/app/ui
      - ./pyproject.toml:/app/pyproject.toml
      - ./.env:/app/.env
    environment:
      - API_BASE_URL=http://backend:8000
    command: >
      bash -c "pip install -q -e . && streamlit run ui/streamlit_app.py --server.port=8501 --server.address=0.0.0.0"
    depends_on:
      - backend
